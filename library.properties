sentence=Dependency-free C++17 BTHome v2 payload builder and parser.
paragraph=Builds and parses BTHome v2 service-data bytes (no BLE stack). No heap, no exceptions, no RTTI. Supports AES-CCM encryption and decryption with pluggable crypto backends (mbedtls and PSA adapters included), including replay protection on the receiving side. Think in sensor values; the library handles object IDs, scaling, endianness and canonical ordering. Pair with any BLE stack.
