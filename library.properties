sentence=Dependency-free C++17 BTHome v2 advertisement payload builder.
paragraph=Builds BTHome v2 service-data bytes only (no BLE stack). No heap, no exceptions, no RTTI. Supports AES-CCM encryption with pluggable crypto backends (mbedtls and PSA adapters included). Think in sensor values; the library handles object IDs, scaling, endianness and canonical ordering. Pair with any BLE stack.
