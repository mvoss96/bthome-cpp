CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="bthome"
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# AES-CCM backend for bthome-cpp via the PSA Crypto API. On vanilla Zephyr
# this is backed by mbedtls software; on the nRF Connect SDK the same code
# uses Oberon/CryptoCell through nrf_security instead.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CCM=y
