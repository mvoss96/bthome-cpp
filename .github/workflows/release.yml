name: Release

# On every version tag: verify the tag matches both library manifests, then
# publish a GitHub release with auto-generated notes. A mismatching tag
# produces a red run and NO release - fix the manifests, delete and re-tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag matches manifest versions
        run: |
          TAG=${GITHUB_REF_NAME#v}
          PROPS=$(grep '^version=' library.properties | cut -d= -f2)
          JSON=$(python3 -c "import json; print(json.load(open('library.json'))['version'])")
          echo "tag=$TAG library.properties=$PROPS library.json=$JSON"
          test "$TAG" = "$PROPS"
          test "$TAG" = "$JSON"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
