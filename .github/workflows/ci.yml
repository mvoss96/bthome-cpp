name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v5
      - name: Install mbedtls (encryption test backend)
        run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev
      - name: Build tests
        run: |
          mkdir -p build
          ${{ matrix.compiler }} -std=c++17 -fno-exceptions -fno-rtti -Wall -Wextra -Werror -I src tests/test_bthome.cpp -o build/test_bthome
          ${{ matrix.compiler }} -std=c++17 -fno-exceptions -fno-rtti -Wall -Wextra -Werror -I src tests/test_factories.cpp -o build/test_factories
          ${{ matrix.compiler }} -std=c++17 -fno-exceptions -fno-rtti -Wall -Wextra -Werror -I src tests/test_encryption.cpp -lmbedcrypto -o build/test_encryption
      - name: Build host examples
        run: |
          ${{ matrix.compiler }} -std=c++17 -fno-exceptions -fno-rtti -Wall -Wextra -Werror -I src examples/generic/main.cpp -o build/demo_generic
          ${{ matrix.compiler }} -std=c++17 -fno-exceptions -fno-rtti -Wall -Wextra -Werror -I src examples/generic_encrypted/main.cpp -lmbedcrypto -o build/demo_encrypted
      - name: Run tests
        run: |
          ./build/test_bthome
          ./build/test_factories
          ./build/test_encryption
          ./build/demo_encrypted
