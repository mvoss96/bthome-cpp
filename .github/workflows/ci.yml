name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v5
      - name: Install mbedtls (encryption test backend)
        run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev
      - name: Build tests
        run: |
          mkdir -p build
          ${{ matrix.compiler }} -std=c++17 -fno-exceptions -fno-rtti -Wall -Wextra -Werror -I src tests/test_bthome.cpp -o build/test_bthome
          ${{ matrix.compiler }} -std=c++17 -fno-exceptions -fno-rtti -Wall -Wextra -Werror -I src tests/test_factories.cpp -o build/test_factories
          ${{ matrix.compiler }} -std=c++17 -fno-exceptions -fno-rtti -Wall -Wextra -Werror -I src tests/test_decode.cpp -o build/test_decode
          ${{ matrix.compiler }} -std=c++17 -fno-exceptions -fno-rtti -Wall -Wextra -Werror -I src tests/test_encryption.cpp -lmbedcrypto -o build/test_encryption
      - name: Build host examples
        run: |
          ${{ matrix.compiler }} -std=c++17 -fno-exceptions -fno-rtti -Wall -Wextra -Werror -I src examples/generic/main.cpp -o build/demo_generic
          ${{ matrix.compiler }} -std=c++17 -fno-exceptions -fno-rtti -Wall -Wextra -Werror -I src examples/generic_decode/main.cpp -o build/demo_decode
          ${{ matrix.compiler }} -std=c++17 -fno-exceptions -fno-rtti -Wall -Wextra -Werror -I src examples/generic_encrypted/main.cpp -lmbedcrypto -o build/demo_encrypted
          ${{ matrix.compiler }} -std=c++17 -fno-exceptions -fno-rtti -Wall -Wextra -Werror -I src examples/generic_decrypt/main.cpp -lmbedcrypto -o build/demo_decrypt
      - name: Run tests
        run: |
          ./build/test_bthome
          ./build/test_factories
          ./build/test_decode
          ./build/test_encryption
          ./build/demo_decode
          ./build/demo_encrypted
          ./build/demo_decrypt

  manifests:
    # library.properties (Arduino) and library.json (PlatformIO) both carry a
    # version field; library.json silently sat at 0.1.0 for two releases.
    # This gate keeps them in lockstep; release.yml additionally checks the
    # tag against both on release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Manifest versions must match
        run: |
          PROPS=$(grep '^version=' library.properties | cut -d= -f2)
          JSON=$(python3 -c "import json; print(json.load(open('library.json'))['version'])")
          echo "library.properties=$PROPS library.json=$JSON"
          test "$PROPS" = "$JSON"
      - name: README install snippets must point at the current minor series
        # `^0.3.0` resolves to >=0.3.0 <0.4.0, so a stale caret hands new users
        # a release without the APIs the same README documents. Compared on
        # major.minor, which is what the caret actually selects - patch
        # releases need no README edit.
        run: |
          SERIES=$(grep '^version=' library.properties | cut -d= -f2 | cut -d. -f1,2)
          CARET=$(grep -oE 'bthome-cpp@\^[0-9]+\.[0-9]+' README.md | head -1 | sed 's/.*@\^//')
          TAG=$(grep -oE 'bthome-cpp\.git#v[0-9]+\.[0-9]+' README.md | head -1 | sed 's/.*#v//')
          echo "library.properties=$SERIES README caret=$CARET README tag=$TAG"
          test -n "$CARET" && test -n "$TAG"
          test "$CARET" = "$SERIES"
          test "$TAG" = "$SERIES"

  interop:
    # Independent oracle: every advertisement this library builds is decoded
    # with bthome-ble - the parser Home Assistant runs - and must yield the
    # values that went in, including decryption via bindkey. bthome-ble is
    # deliberately unpinned: breakage against a new parser release is exactly
    # the early warning this job exists for.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libmbedtls-dev
          pip install bthome-ble
      - name: Build corpus generator
        run: |
          mkdir -p build
          g++ -std=c++17 -fno-exceptions -fno-rtti -Wall -Wextra -Werror -I src tests/interop/generate_corpus.cpp -lmbedcrypto -o build/generate_corpus
      - name: Check corpus against bthome-ble
        run: ./build/generate_corpus | python tests/interop/check_with_bthome_ble.py
